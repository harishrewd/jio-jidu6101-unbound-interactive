# Version 1.26.2-Automated-TrueARMv8Offload-RedisEnabled-r600 (Certified Hardened O2 Build)
name: Build True ARMv8 Optimized Unbound 1.26.2 APK for Jio Jidu 6701

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'v25.12.6' # Matched explicitly to your target drop-down version tag
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd libz3-dev ccache

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis expat libmnl libevent
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      - name: Hard-Coded Injection of True ARMv8 Hardware Assembly Flags into Unbound
        run: |
          MAKEFILE_PATH="openwrt/feeds/packages/net/unbound/Makefile"
          if [ -f "$MAKEFILE_PATH" ]; then
            echo "⚙️ Tweaking specific package configuration parameter block..."
            
            # 1. VERSION LOCKING (Updated to 1.26.2)
            sed -i 's|PKG_VERSION:=.*|PKG_VERSION:=1.26.2|g' "$MAKEFILE_PATH"
            
            # 2. FORCE HASH ALIGNMENT (Official Unbound 1.26.2 SHA256 Checksum)
            sed -i 's|PKG_HASH:=.*|PKG_HASH:=d8ee7aa6bbb3ff1be7d9e57637d0d0ec2f18273a8efff1a0afe2c665858b96f7|g' "$MAKEFILE_PATH"

            # 3. FIXED DOWNLOAD PATH MIRROR BYPASS (Full NLnet Labs storage sub-directory)
            sed -i 's|PKG_SOURCE_URL:=.*|PKG_SOURCE_URL:=https://nlnetlabs.nl|g' "$MAKEFILE_PATH"
            
            # 4. SAFE HARDWARE CRYPTO INJECTION (Optimized specifically for MT7986 Filogic 830 Core)
            sed -i 's|--enable-tfo-server|--enable-tfo-server \\\n\t--with-cflags="-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53" \\\n\t--enable-cachedb \\\n\t--with-libhiredis=\$(STAGING_DIR)/usr|g' "$MAKEFILE_PATH"
            
            # 5. FIXED MODULE SEQUENCE
            sed -i 's|subnetcache ipset respip validator iterator|subnetcache ipset respip validator cachedb iterator|g' "$MAKEFILE_PATH"
            
            # 6. CACHE CONTROL RELEASE BUMP
            sed -i 's|PKG_RELEASE:=.*|PKG_RELEASE:=600|g' "$MAKEFILE_PATH"
            
            # 7. FIXED DEPENDENCY INJECTION
            sed -i 's|\$(call Package/unbound/Default)|\$(call Package/unbound/Default)\n  DEPENDS+= +libhiredis +libmnl|g' "$MAKEFILE_PATH"
            
            # 8. STRIP ALLSYMBOLS
            sed -i 's|--enable-allsymbols||g' "$MAKEFILE_PATH"
            
            # 9. MASTER RULE OVERRIDE: Destroys size optimizations (-Os) for true execution speed on Quad-Core MT7986
            sed -i '/include \$(INCLUDE_DIR)\/package\.mk/i TARGET_CFLAGS:=\$(filter-out -Os, \$(TARGET_CFLAGS)) -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53\nEXTRA_CFLAGS:=\$(filter-out -Os, \$(EXTRA_CFLAGS)) -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53' "$MAKEFILE_PATH"
          else
            echo "❌ Error: Unbound Makefile not found!" && exit 1
          fi

      # 💾 RUNTIME COMPILER ENGINE SPEED STORAGE
      - name: Setup Compiler Cache (ccache Instance)
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ${{ github.workspace }}/openwrt/staging_dir/host/ccache
          key: openwrt-jidu-terminal-ccache-${{ github.run_id }}
          restore-keys: |
            openwrt-jidu-terminal-ccache-

      # 🟩 PHASE 1 & 2: CONFIGURE SELECTIONS & APPLY HARDWARE CRYPTO LOCK
      - name: Configure Target Matrix and Inject Hardware Crypto Modifications
        run: |
          cd openwrt
          
          # Initialize baseline target for JioRouter AX6000 JIDU6701
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6701=y" >> .config
          
          # Enable Cache Engine Optimization globally
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config

          # -----------------------------------------------------------------
          # [AUTOMATED MENUCONFIG SELECTIONS] Libraries -> SSL -> libopenssl 
          # -----------------------------------------------------------------
          echo "CONFIG_PACKAGE_libopenssl=y" >> .config
          echo "CONFIG_PACKAGE_libopenssl-conf=y" >> .config
          echo "CONFIG_OPENSSL_WITH_ASM=y" >> .config
          echo "CONFIG_OPENSSL_ENGINE=y" >> .config
          echo "CONFIG_OPENSSL_OPTIMIZE_SPEED=y" >> .config
          echo "CONFIG_PACKAGE_libopenssl-devcrypto=y" >> .config
          
          # -----------------------------------------------------------------
          # DEPENDENT PACKAGE FLAGS MATCHING MATRIX
          # -----------------------------------------------------------------
          echo "CONFIG_PACKAGE_kmod-cryptodev=y" >> .config
          echo "CONFIG_PACKAGE_libmnl=y" >> .config
          echo "CONFIG_PACKAGE_libevent2=y" >> .config
          echo "CONFIG_PACKAGE_libexpat=y" >> .config
          echo "CONFIG_PACKAGE_libsodium=y" >> .config
          echo "CONFIG_PACKAGE_libhiredis=y" >> .config
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-control=y" >> .config
          echo "CONFIG_PACKAGE_unbound-checkconf=y" >> .config
          echo "CONFIG_PACKAGE_unbound-anchor=y" >> .config
          echo "CONFIG_PACKAGE_unbound-host=y" >> .config
          
          # -----------------------------------------------------------------
          # HARDWARE CRYPTO LOCK (YOUR TERMINAL COMMANDS INJECTED)
          # -----------------------------------------------------------------
          sed -i 's/^TARGET_CFLAGS:=.*/TARGET_CFLAGS:=-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53/g' rules.mk
          sed -i 's/^TARGET_CXXFLAGS:=.*/TARGET_CXXFLAGS:=-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53/g' rules.mk

          echo 'TARGET_CFLAGS += -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53' >> rules.mk
          echo 'TARGET_CXXFLAGS += -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53' >> rules.mk
          echo 'EXTRA_CFLAGS += -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53' >> rules.mk

          sed -i '/CONFIG_TARGET_OPTIMIZATION/d' .config
          echo 'CONFIG_TARGET_OPTIMIZATION="-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53"' >> .config

          # Expand configurations down into tree map
          yes "" | make oldconfig
          make defconfig

      # 🟩 PHASE 3: BACKGROUND TOOLCHAIN PASS (Run synchronously in CI to prevent task drop)
      - name: Build Automated Tools and Toolchain
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          echo "🛠️ Compiling Tools and Toolchain sequentially..."
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      # 🟩 PHASE 4: BUILD KERNEL MATRIX & COMPILE PACKAGES
      - name: Execute Sequential Target Packages Compilation Stack
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          
          echo "🚀 Compiling Kernel Matrix..."
          make target/linux/compile V=s -j$(nproc)
          make package/index
          
          echo "🧹 Performing clean sweep on core targets..."
          make package/libs/openssl/clean
          make package/feeds/packages/unbound/clean

          OPENSSL_MAKEFILE="package/libs/openssl/Makefile"
          if [ -f "$OPENSSL_MAKEFILE" ]; then
            sed -i 's|OPENSSL_TARGET:=.*|OPENSSL_TARGET:=linux-aarch64|g' "$OPENSSL_MAKEFILE"
          fi

          echo "🏗️ Compiling package stack in strict sequential order..."
          make package/cryptodev-linux/compile V=s -j$(nproc)
          make package/libs/libmnl/compile V=s -j$(nproc)
          make package/libs/openssl/compile V=s -j$(nproc)
          make package/libs/libevent2/compile V=s -j$(nproc)
          make package/feeds/packages/expat/compile V=s -j$(nproc)
          make package/feeds/packages/libsodium/compile V=s -j$(nproc)
          make package/feeds/packages/hiredis/compile V=s -j$(nproc)
          make package/feeds/packages/unbound/compile V=s -j$(nproc) IPKG_INSTANT_CHECK=0

      # 📦 HARVEST ARCHIVE STAGE
      - name: Upload All Finished APK Files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jio-jidu6701-unbound-dnscrypt-complete-apk
          path: |
            openwrt/bin/**/*.apk
