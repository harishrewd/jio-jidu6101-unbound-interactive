# Version 1.26.2-SaveFirst-TrueARMv8Offload-RedisEnabled-r600 (Certified Hardened O2 Build)
name: Live Interactive Hardware Crypto Build Room (Save First Pass) 6701

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'v25.12.6' # Matched explicitly to your target drop-down version tag
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y --no-install-recommends \
            build-essential clang diffstat flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd libz3-dev libelf-dev quilt tmate

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis expat libmnl libevent
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      # 🟩 ANTI-DISCONNECT HEARTBEAT
      - name: Launch Background Network Keep-Alive
        run: |
          bash -c "while true; do echo 'Heartbeat active: maintaining network session gateway...'; sleep 30; done" &

      # 🟩 THE SOLID PRO OPENER: Starts a native tmate session background loop securely without relying on strict command keywords
      - name: Open Secure Live Interactive Build Connection via Native Tmate
        run: |
          echo "🚀 Initializing native standalone tmate shell environment..."
          tmate -S /tmp/tmate.sock new-session -d
          
          # Clean bash wait-loop to ensure the sockets generate properly
          sleep 5
          
          echo "========================================================================"
          echo "🔥 JIO 6701 NATIVE BUILD ROOM ACTIVE! 🔥"
          echo "========================================================================"
          echo "➡️ WEB TERMINAL LINK:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
          echo ""
          echo "➡️ SSH TERMINAL COMMAND:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo "========================================================================"
          echo "Type 'touch /tmp/done' inside your connected terminal to complete the build run."
          echo "========================================================================"

      # 🟩 THE COMPILATION GATE HOLDER: Keeps the runner alive until you create the /tmp/done file
      - name: Await User Manual Build Signoff Flag
        run: |
          echo "Waiting for user signoff flag file /tmp/done to be created inside the terminal session room..."
          rm -f /tmp/done
          while [ ! -f /tmp/done ]; do
            sleep 5
          done
          echo "🏁 Signoff flag detected! Initiating package staging and artifact publication engine..."

      # 🟩 THE HARVESTER: Runs automatically AFTER you run the touch command
      - name: Securely Stage Compiled APK Artifacts
        if: always()
        run: |
          STAGING_DIR="${{ github.workspace }}/final_packages"
          mkdir -p "$STAGING_DIR"
          echo "Scanning workspace path for generated packages..."
          find "${{ github.workspace }}/openwrt/bin/" -name "*.apk" -exec cp -v {} "$STAGING_DIR/" \; || true

      - name: Publish Artifact Bundle to GitHub Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jio-jidu6701-unbound-interactive-apk
          path: ${{ github.workspace }}/final_packages/
