name: Live Interactive Hardware Crypto Build Room (Save First Pass)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'main'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis expat libmnl
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      - name: Hard-Coded Tweak of Unbound Suite Version and Engine Manifest
        run: |
          MAKEFILE_PATH="openwrt/feeds/packages/net/unbound/Makefile"
          if [ -f "$MAKEFILE_PATH" ]; then
            echo "⚙️ Configuring version parameters inside Unbound package manifest..."
            sed -i 's|PKG_VERSION:=.*|PKG_VERSION:=1.26.0|g' "$MAKEFILE_PATH"
            sed -i 's|PKG_HASH:=.*|PKG_HASH:=77458a7156e275c0b7b17fabcb357cb12445d95cfcb26fb9bb7d5ecba45e0b63|g' "$MAKEFILE_PATH"
            sed -i 's|PKG_RELEASE:=.*|PKG_RELEASE:=600|g' "$MAKEFILE_PATH"
            
            # 🔍 1. WHERE TCP FAST OPEN (TFO) LIVES:
            sed -i 's|--enable-tfo-server|--enable-tfo-server --enable-tfo-client --enable-cachedb --with-libhiredis=$(STAGING_DIR)/usr|g' "$MAKEFILE_PATH"
            sed -i 's|subnetcache ipset respip validator iterator|subnetcache ipset respip validator cachedb iterator|g' "$MAKEFILE_PATH"
            sed -i 's|\$(call Package/unbound/Default)|\$(call Package/unbound/Default)\n  DEPENDS+= +libhiredis +libmnl|g' "$MAKEFILE_PATH"
            sed -i 's|--enable-allsymbols||g' "$MAKEFILE_PATH"
          else
            echo "❌ Error: Unbound Makefile not found!" && exit 1
          fi

      # 🟩 AUTOMATED PRE-SEED SELECTION LAYER: Configured for Jio JIDU6101
      - name: Pre-Configure Target Profile and Core Feature Modules
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jio_jidu-6101=y" >> .config
          
          echo "CONFIG_PACKAGE_kmod-cryptodev=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl-conf=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl-devcrypto=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl-engine=m" >> .config
          echo "CONFIG_PACKAGE_openssl-util=m" >> .config
          echo "CONFIG_PACKAGE_libmnl=m" >> .config
          echo "CONFIG_PACKAGE_libsodium=m" >> .config
          echo "CONFIG_PACKAGE_libhiredis=m" >> .config
          echo "CONFIG_PACKAGE_libexpat=m" >> .config
          echo "CONFIG_PACKAGE_libevent2=m" >> .config
          echo "CONFIG_PACKAGE_libunbound=m" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=m" >> .config
          echo "CONFIG_PACKAGE_unbound-control=m" >> .config
          echo "CONFIG_PACKAGE_unbound-control-setup=m" >> .config
          echo "CONFIG_PACKAGE_unbound-checkconf=m" >> .config
          echo "CONFIG_PACKAGE_unbound-anchor=m" >> .config
          echo "CONFIG_PACKAGE_unbound-host=m" >> .config
          
          # 🔍 2. WHERE DNSCRYPT LIVES:
          echo "CONFIG_PACKAGE_libunbound_dnscrypt=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_ipset=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libevent=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libpthread=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_subnet=y" >> .config
          
          yes "" | make oldconfig
          make defconfig

      # 🟩 ANTI-DISCONNECT HEARTBEAT: Automatically sends data traffic to stop idle dropouts
      - name: Launch Background Network Keep-Alive
        run: |
          bash -c "while true; do echo 'Heartbeat active: maintaining network session gateway...'; sleep 30; done" &

      # 🟩 PURE BASH ENTRY ROOM: Typo fixed folder path to sources.list.d/
      - name: Open Secure Live Interactive Build Connection
        run: |
          echo "🔓 Adjusting host login policies for anonymous configuration overrides..."
          sudo mkdir -p /var/run/sshd
          echo "root:openwrt" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          echo "💾 Downloading direct open terminal engine..."
          curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          
          # 🔥 FIX: Changed sources.list.p to the correct system path sources.list.d
          echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null
          sudo apt update && sudo apt install -y ngrok
          
          echo "🌐 Starting backend tunnel routing layers..."
          ngrok config add-authtoken 2Xf7g9Z1K4mLvNzPqRwS_3y8x9W7V5U3T1S
          ngrok tcp 22 --log=stdout > /dev/null &
          
          sleep 5
          echo "========================================================================"
          echo "🔥 JIO BUILD ROOM ACTIVE! COPY THE COMMAND BELOW TO LOG IN: 🔥"
          echo "========================================================================"
          TUNNEL_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          CLEAN_URL=$(echo $TUNNEL_URL | sed 's|tcp://||')
          HOST=$(echo $CLEAN_URL | cut -d':' -f1)
          PORT=$(echo $CLEAN_URL | cut -d':' -f2)
          
          echo "👉 PASTE THIS EXACT CODE STRIP INTO YOUR POWERSHELL:"
          echo "ssh root@$HOST -p $PORT"
          echo ""
          echo "🔐 WHEN IT ASKS FOR PASSWORD, ENTER: openwrt"
          echo "========================================================================"
          echo "👉 Run this command inside terminal when done: touch /tmp/done"
          echo "========================================================================"
          
          rm -f /tmp/done
          while [ ! -f /tmp/done ]; do
            sleep 5
          done
          echo "🏁 Closing session room and starting asset compilation upload pipeline..."

      # 🟩 THE FIXER: Collects, stages, and uploads compiled package artifacts when you exit terminal
      - name: Securely Upload Compiled APK Artifacts to GitHub Dashboard
        if: always()
        run: |
          mkdir -p /home/runner/work/final_packages
          find /home/runner/work/ -name "*.apk" -exec cp -v {} /home/runner/work/final_packages/ \;
      
      - name: Publish Artifact Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-unbound-crypto-packages
          path: /home/runner/work/final_packages/
