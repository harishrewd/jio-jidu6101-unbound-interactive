# Version 1.26.2-Interactive-TrueARMv8Offload-RedisEnabled-r600 (Certified Hardened O2 Build)
name: Live Interactive Hardware Crypto Build Room (Save First Pass) 6701

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'v25.12.6' # Matched explicitly to your target drop-down version tag
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd libz3-dev libelf-dev quilt openssh-server

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis expat libmnl libevent
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      # 🟩 ANTI-DISCONNECT HEARTBEAT
      - name: Launch Background Network Keep-Alive
        run: |
          bash -c "while true; do echo 'Heartbeat active: maintaining network session gateway...'; sleep 30; done" &

      # 🟩 YOUR EXACT ORIGINAL PINGGY CODE LAYER (Adapted for 6701 room logs)
      - name: Open Secure Live Interactive Build Connection
        run: |
          echo "🔓 Adjusting host login policies for anonymous configuration overrides..."
          sudo mkdir -p /var/run/sshd
          echo "root:openwrt" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          echo "🌐 Launching Pinggy Reverse TCP Proxy Connection Layer..."
          ssh -p 443 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 \
            -R 443:localhost:22 tcp+pass@a.pinggy.io > /tmp/pinggy.log 2>&1 &
          
          echo "⏳ Syncing server ports..."
          sleep 8
          
          echo "========================================================================"
          echo "🔥 JIO BUILD ROOM ACTIVE! COPY THE COMMAND BELOW TO LOG IN: 🔥"
          echo "========================================================================"
          cat /tmp/pinggy.log
          echo "========================================================================"
          echo "Password for user 'root' is: openwrt"
          echo "Type 'touch /tmp/done' inside your connected terminal to complete the build run."
          echo "========================================================================"

      # 🟩 YOUR EXACT ORIGINAL SIGN-OFF GATE LAYER
      - name: Await User Manual Build Signoff Flag
        run: |
          rm -f /tmp/done
          while [ ! -f /tmp/done ]; do
            sleep 5
          done
          echo "🏁 Closing session room and starting asset compilation upload pipeline..."

      # 🟩 YOUR EXACT ORIGINAL APK HARVESTER LAYER
      - name: Securely Upload Compiled APK Artifacts to GitHub Dashboard
        if: always()
        run: |
          STAGING_DIR="${{ github.workspace }}/final_packages"
          mkdir -p "$STAGING_DIR"
          find "${{ github.workspace }}/openwrt/bin/" -name "*.apk" -exec cp -v {} "$STAGING_DIR/" \; || true
      
      - name: Publish Artifact Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-unbound-crypto-packages
          path: ${{ github.workspace }}/final_packages/
